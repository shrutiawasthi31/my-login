<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | LexReason</title>
    <style>
      :root {
        --cream: #f5efe5;
        --panel: rgba(255, 252, 247, 0.9);
        --ink: #1f1b16;
        --muted: #766d61;
        --line: rgba(150, 126, 83, 0.18);
        --gold: #c9a24d;
        --gold-deep: #aa7d22;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(201, 162, 77, 0.22), transparent 28%),
          radial-gradient(circle at 80% 10%, rgba(89, 98, 74, 0.11), transparent 24%),
          linear-gradient(180deg, #f9f5ee 0%, #f1e8dc 100%);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
      }

      .card {
        width: min(100%, 34rem);
        padding: 2.25rem 2rem;
        border-radius: 1.75rem;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow:
          0 18px 50px rgba(78, 53, 13, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(201, 162, 77, 0.12);
        color: var(--gold-deep);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #1d1812;
        font: 700 clamp(2.3rem, 5vw, 3.4rem) / 1 Georgia, "Times New Roman", serif;
      }

      .subtext {
        margin: 0.85rem 0 1.5rem;
        color: var(--muted);
        line-height: 1.7;
      }

      .field {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2a241d;
        font-weight: 600;
      }

      input,
      select {
        width: 100%;
        height: 3.3rem;
        border-radius: 1rem;
        border: 1px solid rgba(140, 118, 79, 0.16);
        background: rgba(255, 253, 249, 0.94);
        padding: 0 1rem;
        color: #241d16;
        outline: none;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      select {
        appearance: none;
      }

      input:focus,
      select:focus {
        border-color: rgba(201, 162, 77, 0.82);
        box-shadow: 0 0 0 5px rgba(201, 162, 77, 0.12);
      }

      .form-error {
        min-height: 1.25rem;
        margin: 0.65rem 0 0;
        color: #a8472b;
        font-size: 0.92rem;
      }

      .button,
      .ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 3.25rem;
        border-radius: 1rem;
        font-weight: 700;
        text-decoration: none;
      }

      .button {
        border: 0;
        cursor: pointer;
        background: linear-gradient(180deg, #d3ae58 0%, #b98b31 100%);
        color: #fffdf8;
        box-shadow: 0 14px 24px rgba(185, 139, 49, 0.24);
      }

      .ghost {
        margin-top: 0.8rem;
        border: 1px solid rgba(185, 139, 49, 0.25);
        background: rgba(255, 251, 244, 0.94);
        color: #6d5220;
      }

      @media (max-width: 640px) {
        .shell {
          padding: 1rem;
        }

        .card {
          padding: 1.6rem 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="kicker">New Account</div>
        <h1>Create your workspace</h1>
        <p class="subtext">
          Enter your details to create a LexReason account before entering the workspace.
        </p>

        <form id="signup-form">
          <div class="field">
            <label for="full-name">Full Name</label>
            <input id="full-name" type="text" placeholder="Shruti Awasthi" />
          </div>

          <div class="field">
            <label for="signup-email">Work Email</label>
            <input id="signup-email" type="email" placeholder="name@company.com" />
          </div>

          <div class="field">
            <label for="signup-role">Role</label>
            <select id="signup-role">
              <option value="">Select your role</option>
              <option>Independent Litigator</option>
              <option>Senior Counsel</option>
              <option>Corporate Counsel</option>
              <option>Research Associate</option>
            </select>
          </div>

          <div class="field">
            <label for="signup-password">Create Password</label>
            <input id="signup-password" type="password" placeholder="Create a password" />
          </div>

          <button class="button" type="submit">Sign Up</button>
          <p class="form-error" id="signup-error" aria-live="polite"></p>
          <a class="ghost" href="./login.html">Back to Login</a>
        </form>
      </div>
    </div>
    <script>
      document.getElementById("signup-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const fullName = document.getElementById("full-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const role = document.getElementById("signup-role").value.trim();
        const password = document.getElementById("signup-password").value.trim();
        const error = document.getElementById("signup-error");

        if (!fullName || !email || !role || !password) {
          error.textContent = "Please complete all sign-up fields.";
          return;
        }

        error.textContent = "";
        sessionStorage.setItem("lexreasonLoggedIn", "true");
        window.location.href = "welcome.html";
      });
    </script>
  </body>
</html>
