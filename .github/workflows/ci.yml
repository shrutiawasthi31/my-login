name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          test -f welcome.html
          test -f signup.html
          test -f auth.js
          test -f firebase-config.js
          test -f welcome.js
          test -f lawyer-hero.png

      - name: Validate static content
        run: |
          grep -q "LexReason Login" index.html
          grep -q "Welcome back to <span>LexReason</span>" index.html
          grep -q "Continue with Google" index.html
          grep -q "Send OTP" index.html
          grep -q "Create your workspace" signup.html
          grep -q "Sign Up" signup.html
          grep -q "Hello World" welcome.html
          grep -q "Welcome to LexReason" welcome.html
          grep -q "Logout" welcome.html
          grep -q "signInWithPopup" auth.js
          grep -q "signInWithPhoneNumber" auth.js
          grep -q "RecaptchaVerifier" auth.js
          grep -q "firebaseConfig" firebase-config.js
          grep -q "signOut" welcome.js
          echo "Static validation passed."
