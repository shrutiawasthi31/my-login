<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | LexReason</title>
    <style>
      :root {
        --cream: #f5efe5;
        --panel: rgba(255, 252, 247, 0.9);
        --ink: #1f1b16;
        --muted: #766d61;
        --gold: #c9a24d;
        --gold-deep: #aa7d22;
        --line: rgba(150, 126, 83, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(201, 162, 77, 0.22), transparent 28%),
          radial-gradient(circle at 80% 10%, rgba(89, 98, 74, 0.11), transparent 24%),
          linear-gradient(180deg, #f9f5ee 0%, #f1e8dc 100%);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
      }

      .card {
        width: min(100%, 32rem);
        padding: 3rem 2rem;
        border-radius: 1.75rem;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow:
          0 18px 50px rgba(78, 53, 13, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #1d1812;
        font: 700 clamp(2.6rem, 5vw, 4rem) / 1 Georgia, "Times New Roman", serif;
        cursor: pointer;
      }

      h1:hover {
        color: var(--gold-deep);
      }

      p {
        margin: 0.9rem 0 2rem;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .user-meta {
        margin: 0 0 1.6rem;
        padding: 1rem 1.1rem;
        border-radius: 1rem;
        background: rgba(201, 162, 77, 0.08);
        border: 1px solid rgba(170, 125, 34, 0.14);
        text-align: left;
      }

      .user-meta strong {
        display: block;
        margin-bottom: 0.35rem;
        color: #1d1812;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 12rem;
        height: 3.25rem;
        padding: 0 1.5rem;
        border-radius: 1rem;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(180deg, #d3ae58 0%, #b98b31 100%);
        color: #fffdf8;
        box-shadow: 0 14px 24px rgba(185, 139, 49, 0.24);
      }

      .reply {
        min-height: 1.75rem;
        margin: -0.8rem 0 1.4rem;
        color: var(--gold-deep);
        font-weight: 700;
      }

      @media (max-width: 640px) {
        .shell {
          padding: 1.2rem;
        }

        .card {
          padding: 2.25rem 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1 id="hello-title">Hello World</h1>
        <p id="welcome-copy">Welcome to LexReason</p>
        <div class="reply" id="hello-reply" aria-live="polite"></div>
        <div class="user-meta" id="user-meta">
          <strong>Signed in user</strong>
          <span id="user-details">Loading session details...</span>
        </div>
        <a class="button" href="./index.html" id="logout-button">Logout</a>
      </div>
    </div>
    <script type="module" src="./welcome.js"></script>
  </body>
</html>
